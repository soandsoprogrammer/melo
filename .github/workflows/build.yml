name: Build

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "protocol/**", "**.md"]
  pull_request:
    paths-ignore: ["docs/**", "protocol/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile, test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The runner image ships the Android SDK; add the platform this project compiles against.
      - name: Install Android SDK platform 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check shared UI tokens
        run: bash scripts/check-ui-tokens.sh

      # Compiles the app, runs the JVM tests and lint.
      - name: Compile debug, release and device tests
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: melo-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Stage release APK for local signing
        run: |
          mkdir signing-input
          cp app/build/outputs/apk/release/app-release-unsigned.apk signing-input/Melo-unsigned.apk
          (cd signing-input && sha256sum Melo-unsigned.apk > SHA256SUMS.txt)

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: melo-unsigned
          path: signing-input/
          if-no-files-found: error

      - name: Upload device test APK
        uses: actions/upload-artifact@v4
        with:
          name: melo-device-tests
          path: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error

      - name: Test and lint
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug
